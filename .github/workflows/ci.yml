name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Script tests
        run: make script-test
      - name: Release app bundle
        run: make app-release
      - name: Verify app bundle
        run: SPACESULTIMATE_CONFIGURATION=release ./scripts/verify_app_bundle.sh
