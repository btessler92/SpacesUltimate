name: Bug report
description: Report a reproducible problem with SpacesUltimate.
body:
  - type: markdown
    attributes:
      value: "Please remove private Desktop notes, window titles, and local paths from attachments. Report security vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and Mac architecture
      placeholder: "macOS version; Apple silicon or Intel"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display arrangement, Desktop count, and relevant permissions
